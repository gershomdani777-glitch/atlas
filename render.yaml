services:
  - type: web
    name: atlas-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /agent/status
    envVars:
      # Pinned explicitly: the codebase uses PEP 604 "X | None" unions
      # throughout, which requires 3.10+ — never leave this to whatever
      # Render's default happens to be.
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: LLM_TIMEOUT_SECONDS
        value: "20"
      - key: BINANCE_WS_BASE
        value: wss://stream.binance.com:9443
      - key: ASSET_UNIVERSE
        value: btcusdt,ethusdt,solusdt,bnbusdt,xrpusdt,dogeusdt
      - key: DEPTH_STREAM_LEVELS
        value: "20"
      - key: STALENESS_TTL_SECONDS
        value: "10"
      - key: REDIS_WRITE_INTERVAL_SECONDS
        value: "4.0"
      - key: AGENT_CYCLE_SECONDS
        value: "30"
      - key: MEMORY_TOP_K
        value: "3"
      - key: DEFAULT_MAX_POSITION_PCT
        value: "0.12"
      - key: DEFAULT_MAX_EXPOSURE_PCT
        value: "0.45"
      - key: DEFAULT_MAX_ASSET_EXPOSURE_PCT
        value: "0.20"
      - key: DEFAULT_DRAWDOWN_STOP_PCT
        value: "0.08"
      - key: DEFAULT_KELLY_FRACTION
        value: "0.25"
      - key: DEFAULT_MIN_EDGE_OVER_COST_BPS
        value: "8.0"
      - key: STARTING_CAPITAL
        value: "100000.0"
      - key: CORS_ORIGINS
        sync: false
